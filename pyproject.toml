[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safesync-mesh"
version = "2.0.0"
description = "SafeSync-Mesh: Risk-Bounded Semantic Synchronization and Idempotent ISL Relaying for Cooperative LEO Earth-Observation Constellations"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Yonghao Wu", email = "yonghaowu369@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "sgp4>=2.22",
]

[project.optional-dependencies]
gpu = ["torch>=2.2", "pyarrow>=14.0", "Pillow>=10.0"]
dev = ["pytest>=7.4", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["safesync*"]
